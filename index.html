<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Frame-busting script - prevents page from being loaded in frames -->
    <script>
        // Immediate frame-busting check
        if (window.top !== window.self) {
            try {
                // Attempt to break out of the frame
                window.top.location = window.self.location;
            } catch (e) {
                // If blocked by cross-origin policy, use alternative method
                document.write('<style>body{display:none !important;}</style>');
                window.addEventListener('DOMContentLoaded', function() {
                    document.body.innerHTML = '<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;"><div style="text-align:center;"><h1>Security Notice</h1><p>This page cannot be displayed in a frame.</p><p><a href="' + window.location.href + '" target="_top" style="color:#0066cc;text-decoration:underline;">Click here to open in a new window</a></p></div></div>';
                });
            }
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Photo-Reader - Advanced PDF, Text & Image Slideshow Viewer | Multi-Page Display & Image Gallery Tool</title>

    <meta name="keywords" content="PDF viewer, PDF slideshow, text viewer, image viewer, image slideshow, word display, speed reading, document viewer, presentation tool, multi-page PDF, fullscreen PDF, PDF navigation, document slideshow, PDF reader, text reader, image gallery, web PDF viewer, photo slideshow, WebP, JPG, PNG, GIF, SVG viewer">
    <meta name="author" content="Photo-Reader">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph Meta Tags for Social Media -->
    <meta property="og:title" content="Photo-Reader - Advanced PDF, Text & Image Slideshow Viewer">
    <meta property="og:description" content="Powerful web-based PDF, text, and image slideshow viewer with multi-page display, fullscreen presentation mode, word-by-word text display, image gallery support, and customizable timing controls.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://radius.center/photo-reader/">
    <meta property="og:site_name" content="Photo-Reader">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Photo-Reader - Advanced PDF, Text & Image Slideshow Viewer">
    <meta name="twitter:description" content="Powerful web-based PDF, text, and image slideshow viewer with multi-page display, word-by-word text display, image gallery support, and fullscreen presentation mode.">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://radius.center/photo-reader/">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.png">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Preload Critical Resources -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" as="script">
    
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- Document parsing libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Photo-Reader",
        "description": "Advanced PDF, text, and image slideshow viewer with multi-page display, fullscreen presentation mode, word-by-word text display, image gallery support, and customizable timing controls.",
        "url": "https://radius.center/photo-reader/",
        "applicationCategory": "DocumentViewer",
        "operatingSystem": "Web Browser",
        "offers": {
            "@type": "Offer",

            "Fullscreen presentation mode",
            "Customizable timing intervals",

</head>
<body>
    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <div class="container">
        <!-- Header with semantic markup -->
        <header class="control-bar" role="banner">
            <h1 class="visually-hidden">Photo-Reader - PDF Slideshow Viewer</h1>
            <!-- Hidden file controls for logic, but not visible or in flex layout -->
            <div style="width:0;height:0;overflow:hidden;position:absolute;">
                <button id="openBtn" class="btn" title="Select a local file to display" style="display:none;">Open</button>
                <button id="openFolderBtn" class="btn" title="Drag and drop images or select a folder containing images" style="display:none;">Images</button>
                <button id="photoDirectoryBtn" class="btn" title="Select a folder of images" style="display: none;">Select Image Folder</button>
                <input type="file" id="fileInput" accept=".pdf,.txt,.docx,.epub,.mobi,.webp,.jpg,.jpeg,.png,.gif,.svg" style="display: none;">
                <input type="file" id="folderInput" webkitdirectory style="display: none;">
            </div>
            
            <div class="control-group">
                <select id="preloaded" title="Preloaded files for testing" style="margin-right:10px;">
                    <option value="">Menu:</option>
                    <option value=""></option>
                    <option value="add-document">+Add Document</option>
                    <option value="photo-directory">+Add Photos</option>
                    <option value="photo-directory-folder">+Add Photo Directory</option>
                    <option value=""></option>
                    <option value="./Affirmations.TXT">Affirmations.TXT</option>
                    <option value="./Assumptions.TXT">Assumptions.TXT</option>
                    <option value="./Bible.TXT">Bible.TXT</option>
                    <option value="./English_Dictionary.PDF">English_Dictionary.PDF</option>
                    <option value="./Old_Man_&_the_Sea.DOCX">Old_Man_&_the_Sea.DOCX</option>
                    <option value="vision-board">Vision Board</option>
                </select>
            </div>
            
            <div class="control-group" title="Toggle between word-by-word and line-by-line display for text files">
                <button id="displayModeBtn" class="btn" title="Toggle Word/Line mode">Word</button>
            </div>
            
            <div class="control-group" title="Number of Pages to display at once">
                <select id="pageView" style="margin-right:10px;">
                    <!--<option value="">Pages</option>-->
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>
            
            
            <div class="control-group">
                <button id="prevBtn" class="btn nav-btn" disabled title="Go Back 1 Page" style="margin-left:10px;">◀</button>
                <button id="nextBtn" class="btn nav-btn" disabled title="Go Forward 1 Page" style="margin-right:20px;">▶</button>
            </div>
            
            <div class="control-group" title="Page Range to use (or word range for TXT files)">
                <!--<label for="startPage">Start:</label>-->
                <input type="number" id="startPage" min="1" value="1" class="page-input" style="margin-right:5px; margin-left:0;">
                <span style="margin: 0 5px;">To</span>
                <!--<label for="endPage">End:</label>-->
                <input type="number" id="endPage" min="1" value="1" class="page-input" style="margin-left:5px;">
            </div>
            
            <div class="control-group">
                <span id="randomizedOrderToggle" class="toggle-emoji" title="Randomized Order" role="button" tabindex="0">🎲</span>
            </div>
            
            <div class="control-group">
                <span id="reverseOrderToggle" class="toggle-emoji" title="Reverse Order" role="button" tabindex="0">⏪</span>
            </div>
            
            <div class="control-group">
                <span id="rotateContentToggle" class="toggle-emoji" title="Rotate Content by 180°" role="button" tabindex="0">🔄</span>
            </div>
            
            <div class="control-group">
                <span id="mirrorContentToggle" class="toggle-emoji" title="Mirror Content" role="button" tabindex="0">🪞</span>
            </div>
            
            <div class="control-group">
                <span id="verticalGuideToggle" class="toggle-emoji vertical-pipe-emoji" title="Vertical Guide for Speed Reading each line" role="button" tabindex="0">|</span>
            </div>
            
            <div class="control-group">
                <span id="cornerCirclesToggle" class="toggle-emoji" title="Corner Points to defocus gaze" role="button" tabindex="0" style="margin-right:10px;"><span class="icon-corner-circles"></span></span>
            </div>
            
            <div class="control-group">
                <span id="centerDotToggle" class="toggle-emoji" title="Place a centered focal point on-screen" role="button" tabindex="0"><span class="icon-center-dot"></span></span>
            </div>
            
            <div class="control-group" title="Rate of change">
                <label for="interval" style="margin-right:8px;">Interval:</label>
                <input type="number" id="interval" min="0.00" max="60.00" step="0.01" value="0.20" class="interval-input" style="margin-right:10px;">
                <label for="duration" style="margin-left:0; margin-right:8px;">Duration:</label>
                <input type="number" id="duration" min="0.00" max="1.00" step="0.01" value="0.00" class="duration-input" style="width:70px; margin-left:0; margin-right:10px;">
            </div>

                <div class="control-group" title="Transparency of preview/fullscreen">
                    <label for="transparency">Transparency:</label>
                    <input type="number" id="transparency" min="0" max="100" step="1" value="0" class="transparency-input" style="width:60px;">
                    <label for="transparency" style="margin-right:10px; margin-right:10px;">%</label>
                </div>
            
            <div class="control-group">
                <span id="audioEnabledToggle" class="toggle-emoji" title="Tone Frequency to assist in reaching desired Brain wave state" role="button" tabindex="0" style="margin-left:10px; margin-left:10px;">🔊</span>
                <input type="number" id="audioFrequency" min="0.00" max="60.00" step="0.01" value="4.00" class="audio-frequency-input" title="Tone Frequency">
                <label for="audioFrequency" title="Tone Frequency">Hz</label>
            </div>
            
            <div class="control-group">
                <button id="playBtn" class="btn" disabled title="Play Slideshow">Play</button>
            </div>
            
            <div class="control-group help-btn-group">
                <a href="help.html" class="btn help-btn" title="Help" aria-label="Help Documentation">?</a>
            </div>
        </header>
        
        <!-- Main content area -->
        <main id="main-content" class="pdf-container" role="main" aria-label="Content Display Area">
            <div class="pdf-display" id="pdfDisplay">
                <div class="no-pdf" role="status" aria-live="polite">Load a PDF, TXT, DOCX, or image file to begin</div>
                <div id="dragDropArea" class="drag-drop-area" style="display: none;">
                    <button class="drag-drop-close" id="dragDropClose" title="Close drag and drop area">&times;</button>
                    <div class="drag-drop-content">
                        <h3>📁 Drag & Drop Image Folder</h3>
                        <p>Drop multiple image files here or use the folder picker above</p>
                        <small>Supports: JPG, PNG, GIF, WebP, SVG</small>
                    </div>
                </div>
            </div>
            
            <!-- Overlay for transparency effect -->
            <div id="transparencyOverlay" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99;display:none;"></div>
            <!-- Overlay for dots and circles -->
            <div class="overlay" id="overlay" aria-hidden="true"></div>
        </main>
    </div>
    
    <script src="script.js?v=2"></script>
</body>
</html>
